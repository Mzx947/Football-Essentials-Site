<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProPitch Gear | Football Essentials</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #22c55e;
            --accent-hover: #16a34a;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            line-height: 1.6;
            padding-bottom: 50px;
        }

        header {
            background-color: #020617;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
        }

        nav a {
            color: var(--text-light);
            text-decoration: none;
            margin-left: 1.5rem;
            font-weight: 500;
        }

        nav a:hover {
            color: var(--accent);
        }

        .container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .hero {
            text-align: center;
            margin-bottom: 3rem;
        }

        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .hero p {
            color: var(--text-muted);
        }

        /* Filter Controls */
        .controls {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            background-color: var(--card-bg);
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
        }

        .filter-group {
            flex: 1;
            min-width: 200px;
        }

        .filter-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            color: var(--accent);
        }

        select, input, textarea {
            width: 100%;
            padding: 0.75rem;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            font-size: 0.95rem;
        }

        button.btn {
            background-color: var(--accent);
            color: #000;
            font-weight: bold;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        button.btn:hover {
            background-color: var(--accent-hover);
        }

        /* Display Grid */
        .gear-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 1.5rem;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .card h3 {
            color: var(--accent);
        }

        .price-badge {
            background-color: var(--accent);
            color: #000;
            font-weight: bold;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .card-tags {
            margin: 0.5rem 0;
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .tag {
            background-color: #334155;
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
        }

        .card a.buy-btn {
            display: block;
            text-align: center;
            background-color: var(--accent);
            color: #000;
            text-decoration: none;
            font-weight: bold;
            padding: 0.5rem;
            border-radius: 6px;
            margin-top: 1rem;
        }

        /* Admin Form */
        .admin-section {
            margin-top: 4rem;
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 8px;
            border: 2px dashed var(--accent);
        }

        .admin-section h2 {
            margin-bottom: 1rem;
            color: var(--accent);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ ProPitch Gear</div>
        <nav>
            <a href="#finder">Boot Finder</a>
            <a href="#admin">Admin Mode</a>
        </nav>
    </header>

    <div class="container">
        <section class="hero">
            <h1>Find the Perfect Football Boots</h1>
            <p>Filter official boot recommendations by position and age group.</p>
        </section>

        <section class="controls" id="finder">
            <div class="filter-group">
                <label for="filter-position">Position</label>
                <select id="filter-position" onchange="renderCards()">
                    <option value="All">All Positions</option>
                    <option value="Winger / ST">Winger / ST</option>
                    <option value="Midfielder">Midfielder</option>
                    <option value="Defender">Defender</option>
                    <option value="Goalkeeper">Goalkeeper</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filter-age">Age Category</label>
                <select id="filter-age" onchange="renderCards()">
                    <option value="All">All Ages</option>
                    <option value="Kids (5-10)">Kids (5-10)</option>
                    <option value="Youth (11-16)">Youth (11-16)</option>
                    <option value="Adult (17+)">Adult (17+)</option>
                </select>
            </div>
        </section>

        <section class="gear-grid" id="gear-container">
            </section>

        <section class="admin-section" id="admin">
            <h2>⚙️ Admin Mode: Add New Boots</h2>
            <form id="add-shoe-form" onsubmit="handleAddShoe(event)">
                <div class="form-grid">
                    <div>
                        <label>Shoe Name</label>
                        <input type="text" id="shoe-name" placeholder="e.g. Nike Mercurial Vapor 15" required>
                    </div>
                    <div>
                        <label>Price</label>
                        <input type="text" id="shoe-price" placeholder="e.g. $130 or £110" required>
                    </div>
                    <div>
                        <label>Position</label>
                        <select id="shoe-position" required>
                            <option value="Winger / ST">Winger / ST</option>
                            <option value="Midfielder">Midfielder</option>
                            <option value="Defender">Defender</option>
                            <option value="Goalkeeper">Goalkeeper</option>
                        </select>
                    </div>
                    <div>
                        <label>Age Group</label>
                        <select id="shoe-age" required>
                            <option value="Kids (5-10)">Kids (5-10)</option>
                            <option value="Youth (11-16)">Youth (11-16)</option>
                            <option value="Adult (17+)">Adult (17+)</option>
                        </select>
                    </div>
                    <div style="grid-column: 1 / -1;">
                        <label>Store Link</label>
                        <input type="url" id="shoe-link" placeholder="https://..." required>
                    </div>
                </div>
                <div style="margin-bottom: 1rem;">
                    <label>Why it fits this position/age:</label>
                    <textarea id="shoe-desc" rows="2" placeholder="Lightweight upper ideal for max sprint speed..." required></textarea>
                </div>
                <button type="submit" class="btn">Add Boot to Website</button>
            </form>
        </section>
    </div>

    <script>
        // Load default/saved items from localStorage
        let gearList = JSON.parse(localStorage.getItem('propitch_gear')) || [
            {
                id: 1,
                name: "Nike Mercurial Superfly 9",
                price: "$150",
                position: "Winger / ST",
                age: "Youth (11-16)",
                desc: "Built for explosive acceleration and high-speed traction.",
                link: "https://www.nike.com"
            },
            {
                id: 2,
                name: "Adidas Predator Accuracy",
                price: "$220",
                position: "Midfielder",
                age: "Adult (17+)",
                desc: "Grippy rubber elements enhance spin and ball control for pinpoint passes.",
                link: "https://www.adidas.com"
            }
        ];

        function saveAndRender() {
            localStorage.setItem('propitch_gear', JSON.stringify(gearList));
            renderCards();
        }

        function renderCards() {
            const posFilter = document.getElementById('filter-position').value;
            const ageFilter = document.getElementById('filter-age').value;
            const container = document.getElementById('gear-container');

            container.innerHTML = '';

            const filtered = gearList.filter(item => {
                const matchPos = posFilter === 'All' || item.position === posFilter;
                const matchAge = ageFilter === 'All' || item.age === ageFilter;
                return matchPos && matchAge;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<p style="color: var(--text-muted); grid-column: 1/-1; text-align: center;">No boot recommendations found for this filter combination.</p>`;
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div>
                        <div class="card-header">
                            <h3>${item.name}</h3>
                            <span class="price-badge">${item.price}</span>
                        </div>
                        <div class="card-tags">
                            <span class="tag">📍 ${item.position}</span>
                            <span class="tag">👤 ${item.age}</span>
                        </div>
                        <p style="margin-top: 0.5rem; color: #cbd5e1;">${item.desc}</p>
                    </div>
                    <div>
                        <a href="${item.link}" target="_blank" class="buy-btn">Buy Official</a>
                        <button onclick="deleteShoe(${item.id})" style="background: none; border: none; color: #ef4444; font-size: 0.8rem; margin-top: 0.5rem; cursor: pointer; width: 100%;">Remove Item</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function handleAddShoe(e) {
            e.preventDefault();
            
            const newShoe = {
                id: Date.now(),
                name: document.getElementById('shoe-name').value,
                price: document.getElementById('shoe-price').value,
                position: document.getElementById('shoe-position').value,
                age: document.getElementById('shoe-age').value,
                link: document.getElementById('shoe-link').value,
                desc: document.getElementById('shoe-desc').value
            };

            gearList.push(newShoe);
            saveAndRender();

            // Clear form inputs
            document.getElementById('add-shoe-form').reset();
            alert('Boot added successfully with price!');
        }

        function deleteShoe(id) {
            gearList = gearList.filter(item => item.id !== id);
            saveAndRender();
        }

        // Initial Load
        renderCards();
    </script>
</body>
</html>
